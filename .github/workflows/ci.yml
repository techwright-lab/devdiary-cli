name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  rust-collector:
    name: Rust collector (Linux experimental)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
      - name: Format
        run: cargo +1.98.1 fmt --manifest-path collector-rs/Cargo.toml --check
      - name: Contract and storage tests
        run: cargo +1.98.1 test --locked --manifest-path collector-rs/Cargo.toml
      - name: Static analysis
        run: cargo +1.98.1 clippy --locked --manifest-path collector-rs/Cargo.toml --all-targets -- -D warnings
      - name: Python conformance and real subprocess HTTP
        run: PYTHONPATH=src python3 collector-rs/tests/conformance.py -v
      - name: Dependency advisories
        run: |
          cargo +1.98.1 install cargo-audit --version 0.22.2 --locked
          cargo audit --file collector-rs/Cargo.lock

  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install static-analysis tools
        run: python -m pip install --upgrade ruff pyright bandit
      - name: Check formatting
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Type check
        run: pyright
      - name: Security scan
        run: bandit -q -r src/devdiary -ll

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Test source tree (Linux)
        if: runner.os == 'Linux'
        run: |
          # setup-python's shared toolcache may be group-writable. The observer
          # must reject that interpreter; test with a private copy, not a bypass.
          python -m venv --copies "$HOME/.devdiary-test-venv"
          export PATH="$HOME/.devdiary-test-venv/bin:$PATH"
          bin/test
      - name: Test source tree (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          python -m compileall -q src tests
          python -m unittest discover -s tests -p "test_*.py"
      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build --outdir dist
      - name: Install and run wheel console command (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m venv .verify-venv
          .verify-venv/bin/python -m pip install --upgrade pip
          .verify-venv/bin/python -m pip install dist/*.whl
          .verify-venv/bin/devdiary --version
          .verify-venv/bin/devdiary schema envelope
      - name: Install and run wheel console command (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv .verify-venv
          & .\.verify-venv\Scripts\python.exe -m pip install --upgrade pip
          $wheel = (Get-ChildItem dist/*.whl | Select-Object -First 1).FullName
          & .\.verify-venv\Scripts\python.exe -m pip install $wheel
          & .\.verify-venv\Scripts\devdiary.exe --version
          & .\.verify-venv\Scripts\devdiary.exe schema envelope
